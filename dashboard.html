<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Dashboard — IELTS Master</title>
  <meta name="description" content="Track your IELTS progress: band trends over time, per-skill scores, study streaks and full test history." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%232f6bf6'/><text x='50' y='68' font-size='54' font-family='Arial' font-weight='bold' fill='white' text-anchor='middle'>iM</text></svg>" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
  <div id="site-header"></div>

  <div class="container page-head">
    <span class="eyebrow">📊 Your progress</span>
    <h1>My dashboard</h1>
    <p style="max-width:620px;margin:0 auto;">Everything you've practised, tracked on this device. Watch your bands climb toward your goal.</p>
  </div>

  <div class="container" style="padding-bottom:80px;">
    <!-- empty state -->
    <div class="panel panel-pad center" id="emptyState" style="display:none;">
      <div style="font-size:3rem;">🚀</div>
      <h3>No results yet</h3>
      <p>Take a practice test to start tracking your progress.</p>
      <a href="practice.html" class="btn btn-primary">Start practising →</a>
    </div>

    <div id="dashContent">
      <!-- KPI row -->
      <div class="grid grid-4" id="kpis"></div>

      <!-- Overall band + goal -->
      <div class="reading-layout mt-3">
        <div class="panel panel-pad">
          <div class="flex between items-center"><h3 class="mb-0">Band trend</h3>
            <div class="flex gap-sm" id="trendTabs"></div></div>
          <div id="chart" style="margin-top:16px;"></div>
        </div>
        <div class="panel panel-pad">
          <h3>Skill breakdown</h3>
          <div id="skillBars" style="margin-top:10px;"></div>
          <div class="mt-3">
            <label class="small" style="font-weight:700;">Target band</label>
            <div class="flex gap-sm items-center mt-1">
              <input class="field" type="number" id="goalInput" min="4" max="9" step="0.5" style="max-width:110px;">
              <span class="muted small" id="goalMsg"></span>
            </div>
          </div>
        </div>
      </div>

      <!-- History -->
      <div class="panel panel-pad mt-3">
        <div class="flex between items-center"><h3 class="mb-0">Test history</h3>
          <button class="btn btn-ghost" id="clearBtn">Clear all</button></div>
        <div style="overflow-x:auto;"><table id="histTable" style="width:100%;border-collapse:collapse;margin-top:14px;"></table></div>
      </div>
    </div>
  </div>

  <div id="site-footer"></div>
  <script src="assets/js/main.js"></script>
  <script src="assets/js/store.js"></script>
  <script src="assets/js/dashboard.js"></script>
</body>
</html>
