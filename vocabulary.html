<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IELTS Vocabulary Flashcards — IELTS Master</title>
  <meta name="description" content="Learn high-band IELTS vocabulary with interactive flashcards grouped by topic. Definitions, examples and self-tracking." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%232f6bf6'/><text x='50' y='68' font-size='54' font-family='Arial' font-weight='bold' fill='white' text-anchor='middle'>iM</text></svg>" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
  <div id="site-header"></div>

  <div class="container page-head">
    <span class="eyebrow">📚 Band 7+ lexis</span>
    <h1>Vocabulary flashcards</h1>
    <p style="max-width:620px;margin:0 auto;">Master topic vocabulary examiners love. Tap a card to flip it, and work through each theme.</p>
  </div>

  <div class="container" style="padding-bottom:80px;">
    <div class="tabs center" id="topicTabs" style="justify-content:center;"></div>

    <div class="flash-wrap">
      <div class="flash" id="flash">
        <div class="flash-inner">
          <div class="flash-face flash-front">
            <div class="word" id="fWord">—</div>
            <div class="pos" id="fPos"></div>
            <span class="small" style="opacity:.7;margin-top:16px;">tap to flip</span>
          </div>
          <div class="flash-face flash-back">
            <div class="def" id="fDef"></div>
            <div class="ex" id="fEx"></div>
          </div>
        </div>
      </div>

      <div class="flash-nav">
        <button class="btn btn-ghost" id="prevCard">← Prev</button>
        <span class="muted small" id="counter">1 / 1</span>
        <button class="btn btn-primary" id="nextCard">Next →</button>
      </div>
      <div class="center mt-3">
        <button class="btn btn-ghost" id="shuffleBtn">🔀 Shuffle</button>
        <button class="btn btn-ghost" id="speakCard">🔊 Pronounce</button>
      </div>
    </div>

    <div class="center mt-3">
      <a href="calculator.html" class="btn btn-ghost">Next: Band calculator →</a>
    </div>
  </div>

  <div id="site-footer"></div>
  <script src="assets/js/main.js"></script>
  <script src="assets/js/vocabulary.js"></script>
</body>
</html>
