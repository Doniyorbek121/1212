<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Full IELTS Listening Test — 4 Sections, 40 Questions — IELTS Master</title>
  <meta name="description" content="A complete IELTS Listening mock: four sections with real audio playback, 40 questions and an official band conversion." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%232f6bf6'/><text x='50' y='68' font-size='54' font-family='Arial' font-weight='bold' fill='white' text-anchor='middle'>iM</text></svg>" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
  <div id="site-header"></div>

  <div class="container page-head">
    <div class="breadcrumb"><a href="practice.html">Practice</a> / Listening</div>
    <span class="eyebrow">🎧 Listening · Full Mock</span>
    <h1>Listening mock test</h1>
    <p style="max-width:640px;margin:0 auto;">Four sections, 40 questions. Play each recording (it uses your browser's speech engine — headphones recommended), answer, then submit.</p>
  </div>

  <div class="container" style="padding-bottom:80px;">
    <div class="panel panel-pad" style="margin-bottom:18px;position:sticky;top:76px;z-index:40;">
      <div class="flex between items-center wrap gap">
        <div class="flex items-center gap-sm wrap">
          <select class="field" id="testSelector" style="max-width:210px;padding:9px 12px;"></select>
          <div class="tabs" id="sectionTabs" style="margin-bottom:0;"></div>
        </div>
        <div class="flex items-center gap-sm wrap">
          <span class="muted small">Answered <b id="answeredCount">0</b>/40</span>
          <button class="btn btn-primary" id="submitBtn">Submit test</button>
        </div>
      </div>
    </div>

    <div id="sections"></div>

    <div class="result-box" id="result">
      <div class="big text-grad" id="scoreText">0 / 40</div>
      <div class="band-pill" id="bandPill">Band —</div>
      <p class="small mt-2" id="resultMsg"></p>
      <div class="grid grid-4 mt-3" id="perSection"></div>
      <button class="btn btn-ghost mt-3" id="retryBtn">Try again</button>
    </div>

    <div class="center mt-3">
      <a href="writing.html" class="btn btn-ghost">Next: Writing lab →</a>
    </div>
  </div>

  <div id="site-footer"></div>
  <script src="assets/js/main.js"></script>
  <script src="assets/js/store.js"></script>
  <script src="assets/js/listening-data.js"></script>
  <script src="assets/js/listening.js"></script>
</body>
</html>
