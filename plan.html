<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IELTS Study Plan Generator — IELTS Master</title>
  <meta name="description" content="Generate a personalised week-by-week IELTS study plan from your current band, target band and available time — with daily tasks and optional AI enhancement." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%232f6bf6'/><text x='50' y='68' font-size='54' font-family='Arial' font-weight='bold' fill='white' text-anchor='middle'>iM</text></svg>" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
  <div id="site-header"></div>

  <div class="container page-head">
    <span class="eyebrow">🗓️ Personalised roadmap</span>
    <h1>Study plan <span class="text-grad">generator</span></h1>
    <p style="max-width:640px;margin:0 auto;">Tell us where you are and where you want to be. We'll build a week-by-week plan with daily tasks that link straight to your practice.</p>
  </div>

  <div class="container" style="padding-bottom:80px;">
    <div class="reading-layout">
      <!-- INPUTS -->
      <div class="panel panel-pad" style="position:sticky;top:84px;align-self:start;">
        <h3>Your details</h3>
        <div class="calc-field mt-2"><label>Current band: <b id="curVal">6.0</b></label>
          <input type="range" id="cur" min="3" max="8.5" step="0.5" value="6" style="width:100%;"></div>
        <div class="calc-field mt-2"><label>Target band: <b id="tgtVal">7.0</b></label>
          <input type="range" id="tgt" min="4" max="9" step="0.5" value="7" style="width:100%;"></div>
        <div class="calc-field mt-2"><label>Study hours per day: <b id="hrsVal">2</b></label>
          <input type="range" id="hrs" min="1" max="8" step="1" value="2" style="width:100%;"></div>
        <div class="calc-field mt-2"><label>Weeks until your test: <b id="wkVal">6</b></label>
          <input type="range" id="wk" min="1" max="12" step="1" value="6" style="width:100%;"></div>
        <div class="calc-field mt-2"><label>Weakest skill (extra focus)</label>
          <select class="field" id="focus">
            <option value="none">No preference</option>
            <option value="Listening">Listening</option>
            <option value="Reading">Reading</option>
            <option value="Writing">Writing</option>
            <option value="Speaking">Speaking</option>
          </select></div>
        <div class="calc-field mt-2"><label>Test type</label>
          <select class="field" id="ttype"><option>Academic</option><option>General Training</option></select></div>
        <button class="btn btn-primary btn-block btn-lg mt-3" id="genBtn">Generate my plan →</button>
      </div>

      <!-- OUTPUT -->
      <div>
        <div class="panel panel-pad" id="summary" style="display:none;margin-bottom:18px;"></div>
        <div class="flex gap-sm wrap" id="planActions" style="display:none;margin-bottom:18px;">
          <button class="btn btn-accent" id="aiBtn">🤖 Enhance with AI</button>
          <button class="btn btn-ghost" id="copyBtn">📋 Copy</button>
          <button class="btn btn-ghost" id="dlBtn">⬇ Download</button>
          <button class="btn btn-ghost" id="printBtn">🖨 Print</button>
        </div>
        <div id="aiKeyPanel" style="display:none;margin-bottom:18px;"></div>
        <div id="aiPlan" class="panel panel-pad" style="display:none;margin-bottom:18px;white-space:pre-wrap;line-height:1.65;"></div>
        <div id="planOut"></div>
        <div class="panel panel-pad center" id="placeholder">
          <div style="font-size:2.6rem;">🎯</div>
          <h3>Your plan will appear here</h3>
          <p class="mb-0">Set your details on the left and hit <b>Generate</b>.</p>
        </div>
      </div>
    </div>
  </div>

  <div id="site-footer"></div>
  <script src="assets/js/main.js"></script>
  <script src="assets/js/store.js"></script>
  <script src="assets/js/ai.js"></script>
  <script src="assets/js/plan.js"></script>
</body>
</html>
